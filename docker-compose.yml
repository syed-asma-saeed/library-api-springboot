      JWT_EXPIRATION: 86400000
    depends_on:
      mysql:
        condition: service_healthy
        # API only starts after MySQL healthcheck passes
    restart: unless-stopped
    # Restart automatically if container crashes

volumes:
  mysql_data:
  # Named volume persists data outside containers
  # Removing containers doesn't delete your data