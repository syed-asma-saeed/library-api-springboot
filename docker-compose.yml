  # Spring Boot API container
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-api
    ports:
      - "8080:8080"
    environment:
      # Override application.properties values
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/library_db
      # "mysql" is the service name above — Docker resolves it
      # to the MySQL container's IP automatically
      SPRING_DATASOURCE_USERNAME: library_user
      SPRING_DATASOURCE_PASSWORD: library_password
